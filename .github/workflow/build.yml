name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project files
        run: |
          mkdir -p breakout/app/src/main/java/com/scan/breakout
          cat > breakout/settings.gradle.kts <<'KTEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BreakoutScanner"
          include(":app")
          KTEOF
          cat > breakout/build.gradle.kts <<'KTEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          KTEOF
          cat > breakout/gradle.properties <<'KTEOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          KTEOF
          cat > breakout/app/build.gradle.kts <<'KTEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.scan.breakout"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.scan.breakout"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          KTEOF
          cat > breakout/app/src/main/AndroidManifest.xml <<'KTEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="Breakout Scanner"
                  android:theme="@android:style/Theme.Material.Light">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          KTEOF
          cat > breakout/app/src/main/java/com/scan/breakout/MainActivity.kt <<'KTEOF'
          package com.scan.breakout

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.ProgressBar
          import android.widget.TextView
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale
          import java.util.concurrent.ConcurrentLinkedQueue
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import java.util.concurrent.atomic.AtomicInteger
          import org.json.JSONObject

          class Bars(val c: DoubleArray, val h: DoubleArray, val l: DoubleArray, val v: DoubleArray)

          class Res(
              val sym: String, val il: Boolean, val price: Double, val status: String,
              val pivot: Double, val dist: Double, val volX: Double, val contr: String,
              val fromHigh: Double, val entry: Double, val stop: Double, val avgVol: Double,
              val trend: Boolean, val vcp: Boolean, val rsRaw: Double
          ) {
              var rs: Double = 0.0
          }

          class MainActivity : Activity() {

              private lateinit var cbUs: CheckBox
              private lateinit var cbNq: CheckBox
              private lateinit var cbIl: CheckBox
              private lateinit var cbVcp: CheckBox
              private lateinit var etRs: EditText
              private lateinit var etPrice: EditText
              private lateinit var etVol: EditText
              private lateinit var btnScan: Button
              private lateinit var tvStatus: TextView
              private lateinit var tvMarket: TextView
              private lateinit var progress: ProgressBar
              private lateinit var adapter: ResAdapter

              private val shown = ArrayList<Res>()

              @Volatile
              private var cancelled = false
              private var running = false

              // ---------------------------------------------------------------- UI
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val dp = resources.displayMetrics.density
                  val pad = (10 * dp).toInt()

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(pad, pad, pad, pad)

                  val title = TextView(this)
                  title.text = "Breakout Scanner - Trend Template + VCP"
                  title.textSize = 18f
                  title.setTypeface(title.typeface, Typeface.BOLD)
                  root.addView(title)

                  cbUs = CheckBox(this)
                  cbUs.text = "S&P 500"
                  cbUs.isChecked = true
                  root.addView(cbUs)

                  cbNq = CheckBox(this)
                  cbNq.text = "Nasdaq-100"
                  cbNq.isChecked = true
                  root.addView(cbNq)

                  cbIl = CheckBox(this)
                  cbIl.text = "Israel (TA-35 / TA-90 / TA-125)"
                  cbIl.isChecked = true
                  root.addView(cbIl)

                  cbVcp = CheckBox(this)
                  cbVcp.text = "Require VCP pattern"
                  cbVcp.isChecked = true
                  root.addView(cbVcp)

                  etRs = addRow(root, "RS minimum (0-99)", "70")
                  etPrice = addRow(root, "Min price (0 = any)", "0")
                  etVol = addRow(root, "Min avg volume (0 = any)", "0")

                  val buttons = LinearLayout(this)
                  buttons.orientation = LinearLayout.HORIZONTAL
                  btnScan = Button(this)
                  btnScan.text = "Start scan"
                  btnScan.setOnClickListener { startScan() }
                  val btnIl = Button(this)
                  btnIl.text = "Edit TASE list"
                  btnIl.setOnClickListener { editIl() }
                  buttons.addView(btnScan, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  buttons.addView(btnIl, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  root.addView(buttons)

                  progress = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  root.addView(progress)

                  tvStatus = TextView(this)
                  tvStatus.text = "Ready"
                  root.addView(tvStatus)

                  tvMarket = TextView(this)
                  tvMarket.setTypeface(tvMarket.typeface, Typeface.BOLD)
                  root.addView(tvMarket)

                  adapter = ResAdapter(this, shown)
                  val lv = ListView(this)
                  lv.adapter = adapter
                  lv.setOnItemClickListener { _, _, pos, _ -> openChart(shown[pos]) }
                  root.addView(lv, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))

                  setContentView(root)
              }

              private fun addRow(parent: LinearLayout, label: String, def: String): EditText {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  val tv = TextView(this)
                  tv.text = label
                  val et = EditText(this)
                  et.setText(def)
                  et.inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                  row.addView(tv, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  row.addView(et, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  parent.addView(row)
                  return et
              }

              private fun ui(f: () -> Unit) {
                  runOnUiThread { f() }
              }

              private fun f(x: Double, d: Int = 2): String = String.format(Locale.US, "%." + d + "f", x)

              inner class ResAdapter(ctx: Context, list: ArrayList<Res>) : ArrayAdapter<Res>(ctx, 0, list) {
                  override fun getView(position: Int, convertView: View?, parent: ViewGroup): View {
                      val tv: TextView = (convertView as? TextView) ?: TextView(context)
                      tv.setPadding(16, 16, 16, 16)
                      tv.textSize = 14f
                      val r = getItem(position)!!
                      val name = if (r.il) r.sym.removeSuffix(".TA") + " (IL)" else r.sym
                      tv.text = name + "   " + r.status + "   RS " + r.rs.toInt() + "\n" +
                          "Price " + f(r.price) + " | pivot " + f(r.pivot) + " (" + f(r.dist * 100, 1) + "%) | vol x" + f(r.volX, 1) + "\n" +
                          "Contractions " + r.contr + "% | from high " + f(r.fromHigh * 100, 0) + "% | entry " + f(r.entry) + " stop " + f(r.stop)
                      tv.setTextColor(
                          when (r.status) {
                              "BREAKOUT" -> Color.rgb(0, 140, 0)
                              "NEAR PIVOT" -> Color.rgb(0, 70, 200)
                              else -> Color.BLACK
                          }
                      )
                      return tv
                  }
              }

              private fun openChart(r: Res) {
                  val s = if (r.il) "TASE:" + r.sym.removeSuffix(".TA") else r.sym.replace("-", ".")
                  val uri = Uri.parse("https://www.tradingview.com/chart/?symbol=" + Uri.encode(s))
                  startActivity(Intent(Intent.ACTION_VIEW, uri))
              }

              // ------------------------------------------------------ TASE list
              private val defaultIl = "LUMI POLI DSCT MZTF FIBI BEZQ ICL TEVA NICE ESLT AZRG AMOT MVNE MLSR ORL ENLT ENRG " +
                  "DLEKG NVMI PHOE HARL CLIS MGDL ALHE STRS MTRX FTAL ELAL ARPT BIG GZIT SKBN TSEM NXSN CAMT FOX PTNR CEL " +
                  "AURA SAE SPEN DIMRI ELCO"

              private fun ilRaw(): String =
                  getSharedPreferences("scan", Context.MODE_PRIVATE).getString("il", defaultIl) ?: defaultIl

              private fun ilSymbols(): List<String> =
                  ilRaw().split(Regex("[\\s,;]+"))
                      .map { it.trim().uppercase() }
                      .filter { it.isNotEmpty() }
                      .map { if (it.endsWith(".TA")) it else it + ".TA" }
                      .distinct()

              private fun editIl() {
                  val et = EditText(this)
                  et.setText(ilRaw())
                  et.minLines = 6
                  et.gravity = Gravity.TOP
                  AlertDialog.Builder(this)
                      .setTitle("TASE symbols (.TA added automatically)")
                      .setView(et)
                      .setPositiveButton("Save") { _, _ ->
                          getSharedPreferences("scan", Context.MODE_PRIVATE).edit()
                              .putString("il", et.text.toString()).apply()
                      }
                      .setNegativeButton("Cancel", null)
                      .show()
              }

              // ---------------------------------------------------------- scan
              private fun startScan() {
                  if (running) {
                      cancelled = true
                      tvStatus.text = "Stopping..."
                      return
                  }
                  val rsMin = etRs.text.toString().toDoubleOrNull() ?: 70.0
                  val minPrice = etPrice.text.toString().toDoubleOrNull() ?: 0.0
                  val minVol = etVol.text.toString().toDoubleOrNull() ?: 0.0
                  val needVcp = cbVcp.isChecked
                  val doUs = cbUs.isChecked
                  val doNq = cbNq.isChecked
                  val doIl = cbIl.isChecked

                  running = true
                  cancelled = false
                  btnScan.text = "Stop"
                  shown.clear()
                  adapter.notifyDataSetChanged()
                  tvMarket.text = ""

                  Thread {
                      try {
                          runScan(doUs, doNq, doIl, rsMin, minPrice, minVol, needVcp)
                      } catch (e: Exception) {
                          ui { tvStatus.text = "Error: " + e.message }
                      }
                      ui {
                          running = false
                          btnScan.text = "Start scan"
                      }
                  }.start()
              }

              private fun runScan(doUs: Boolean, doNq: Boolean, doIl: Boolean, rsMin: Double, minPrice: Double, minVol: Double, needVcp: Boolean) {
                  val syms = ArrayList<Pair<String, Boolean>>()
                  if (doUs || doNq) {
                      ui { tvStatus.text = "Loading symbol lists..." }
                      val us = LinkedHashSet<String>()
                      var msg = ""
                      if (doUs) {
                          val sp = loadSp500()
                          if (sp.isEmpty()) msg += "S&P500 list failed. "
                          us.addAll(sp)
                      }
                      if (doNq) {
                          val nq = loadNdx()
                          if (nq.isEmpty()) msg += "Nasdaq-100 list failed. "
                          us.addAll(nq)
                      }
                      if (msg.isNotEmpty()) ui { tvStatus.text = msg }
                      for (s in us) syms.add(Pair(s, false))
                  }
                  if (doIl) {
                      for (s in ilSymbols()) syms.add(Pair(s, true))
                  }
                  if (syms.isEmpty()) {
                      ui { tvStatus.text = "No symbols to scan" }
                      return
                  }

                  val mk = marketLine()
                  ui { tvMarket.text = mk }

                  val pool = Executors.newFixedThreadPool(10)
                  val out = ConcurrentLinkedQueue<Res>()
                  val done = AtomicInteger(0)
                  val failed = AtomicInteger(0)
                  val total = syms.size
                  ui {
                      progress.max = total
                      progress.progress = 0
                  }
                  for (item in syms) {
                      val sym = item.first
                      val il = item.second
                      pool.execute {
                          if (!cancelled) {
                              val bars = fetchBars(sym)
                              if (bars == null) {
                                  failed.incrementAndGet()
                              } else {
                                  val r = analyze(sym, il, bars)
                                  if (r != null) out.add(r)
                              }
                          }
                          val d = done.incrementAndGet()
                          if (d % 25 == 0 || d == total) {
                              ui {
                                  progress.progress = d
                                  tvStatus.text = "Scanned " + d + "/" + total + " | no data: " + failed.get() + " | analysed: " + out.size
                              }
                          }
                      }
                  }
                  pool.shutdown()
                  pool.awaitTermination(3, TimeUnit.HOURS)

                  val all = out.toList()
                  if (all.isEmpty()) {
                      ui { tvStatus.text = "No data came back. Check internet / try again." }
                      return
                  }
                  val sorted = all.sortedBy { it.rsRaw }
                  for (i in sorted.indices) sorted[i].rs = (i + 1) * 100.0 / sorted.size

                  val order = mapOf("BREAKOUT" to 0, "NEAR PIVOT" to 1, "BUILDING" to 2)
                  val hits = all
                      .filter { it.trend && it.rs >= rsMin && (!needVcp || it.vcp) && it.price >= minPrice && it.avgVol >= minVol }
                      .sortedWith(compareBy<Res>({ order[it.status] ?: 3 }, { -it.rs }))

                  val stopped = cancelled
                  ui {
                      shown.clear()
                      shown.addAll(hits)
                      adapter.notifyDataSetChanged()
                      tvStatus.text = (if (stopped) "Stopped. " else "Done. ") + hits.size + " matches out of " + all.size + " analysed (" + failed.get() + " had no data)"
                  }
              }

              // ------------------------------------------------------ universe
              private fun loadSp500(): List<String> {
                  val out = LinkedHashSet<String>()
                  val t = http("https://raw.githubusercontent.com/datasets/s-and-p-500-companies/main/data/constituents.csv")
                  if (t != null) {
                      for (ln in t.lines().drop(1)) {
                          val sym = ln.substringBefore(",").trim().replace(".", "-")
                          if (sym.isNotEmpty()) out.add(sym)
                      }
                  }
                  return out.toList()
              }

              private fun loadNdx(): List<String> {
                  val out = LinkedHashSet<String>()
                  val t = http("https://api.nasdaq.com/api/quote/list-type/nasdaq100")
                  if (t != null) {
                      try {
                          val rows = JSONObject(t).getJSONObject("data").getJSONObject("data").getJSONArray("rows")
                          for (i in 0 until rows.length()) {
                              val sym = rows.getJSONObject(i).getString("symbol").trim().replace(".", "-")
                              if (sym.isNotEmpty()) out.add(sym)
                          }
                      } catch (e: Exception) {
                      }
                  }
                  return out.toList()
              }

              private fun marketLine(): String {
                  val sb = StringBuilder()
                  val idx = listOf(Pair("US", "^GSPC"), Pair("IL", "^TA125.TA"))
                  for (e in idx) {
                      val b = fetchBars(e.second)
                      val txt: String
                      if (b == null || b.c.size < 200) {
                          txt = "n/a"
                      } else {
                          val n = b.c.size
                          val s50 = avg(b.c, n - 50, n)
                          val s200 = avg(b.c, n - 200, n)
                          txt = if (b.c[n - 1] > s50 && s50 > s200) "uptrend" else "WEAK - breakouts often fail"
                      }
                      sb.append(e.first + " market: " + txt + "    ")
                  }
                  return sb.toString()
              }

              // ---------------------------------------------------------- data
              private fun http(url: String): String? {
                  for (attempt in 0 until 3) {
                      if (cancelled) return null
                      try {
                          val cn = URL(url).openConnection() as HttpURLConnection
                          cn.connectTimeout = 10000
                          cn.readTimeout = 15000
                          cn.setRequestProperty("Accept", "application/json, text/plain, */*")
                          cn.setRequestProperty(
                              "User-Agent",
                              "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36"
                          )
                          val code = cn.responseCode
                          if (code == 200) {
                              val t = cn.inputStream.bufferedReader().use { it.readText() }
                              cn.disconnect()
                              return t
                          }
                          cn.disconnect()
                          if (code == 404) return null
                          Thread.sleep(1200L * (attempt + 1))
                      } catch (e: Exception) {
                          try {
                              Thread.sleep(600)
                          } catch (ie: InterruptedException) {
                          }
                      }
                  }
                  return null
              }

              private fun fetchBars(sym: String): Bars? {
                  val txt = http("https://query1.finance.yahoo.com/v8/finance/chart/" + Uri.encode(sym) + "?range=2y&interval=1d")
                      ?: return null
                  return try {
                      val q = JSONObject(txt).getJSONObject("chart").getJSONArray("result").getJSONObject(0)
                          .getJSONObject("indicators").getJSONArray("quote").getJSONObject(0)
                      val cl = q.getJSONArray("close")
                      val hi = q.getJSONArray("high")
                      val lo = q.getJSONArray("low")
                      val vo = q.optJSONArray("volume")
                      val c = ArrayList<Double>()
                      val h = ArrayList<Double>()
                      val l = ArrayList<Double>()
                      val v = ArrayList<Double>()
                      for (i in 0 until cl.length()) {
                          if (cl.isNull(i) || hi.isNull(i) || lo.isNull(i)) continue
                          c.add(cl.getDouble(i))
                          h.add(hi.getDouble(i))
                          l.add(lo.getDouble(i))
                          v.add(if (vo == null || vo.isNull(i)) 0.0 else vo.getDouble(i))
                      }
                      Bars(c.toDoubleArray(), h.toDoubleArray(), l.toDoubleArray(), v.toDoubleArray())
                  } catch (e: Exception) {
                      null
                  }
              }

              // ------------------------------------------------------ analysis
              // average of a[from until to]
              private fun avg(a: DoubleArray, from: Int, to: Int): Double {
                  var s = 0.0
                  for (i in from until to) s += a[i]
                  return s / (to - from)
              }

              private fun analyze(sym: String, il: Boolean, b: Bars): Res? {
                  val n = b.c.size
                  if (n < 260) return null
                  val c = b.c
                  val p = c[n - 1]
                  if (p <= 0 || c[n - 63] <= 0 || c[n - 126] <= 0 || c[n - 189] <= 0 || c[n - 252] <= 0) return null

                  // Trend Template
                  val s50 = avg(c, n - 50, n)
                  val s150 = avg(c, n - 150, n)
                  val s200 = avg(c, n - 200, n)
                  val s200Prev = avg(c, n - 222, n - 22)
                  var lo = Double.MAX_VALUE
                  var hi = 0.0
                  for (i in n - 252 until n) {
                      lo = minOf(lo, c[i])
                      hi = maxOf(hi, c[i])
                  }
                  val trend = p > s150 && p > s200 && s150 > s200 && s200 > s200Prev &&
                      s50 > s150 && s50 > s200 && p > s50 &&
                      p >= lo * 1.30 && p >= hi * 0.75

                  // VCP: 3 shrinking contractions over the last 60 bars + volume dry-up
                  val bs = n - 60
                  val depths = DoubleArray(3)
                  for (k in 0 until 3) {
                      var mh = 0.0
                      var ml = Double.MAX_VALUE
                      for (i in (bs + k * 20) until (bs + (k + 1) * 20)) {
                          mh = maxOf(mh, b.h[i])
                          ml = minOf(ml, b.l[i])
                      }
                      depths[k] = if (mh > 0) (mh - ml) / mh else 1.0
                  }
                  val avg50v = avg(b.v, n - 50, n)
                  val avg10v = avg(b.v, n - 10, n)
                  val vcp = depths[0] > depths[1] && depths[1] > depths[2] &&
                      depths[2] <= 0.10 && avg50v > 0 && avg10v < avg50v

                  // Pivot and status
                  var pivot = 0.0
                  for (i in (n - 16) until (n - 1)) pivot = maxOf(pivot, b.h[i])
                  if (pivot <= 0) return null
                  val dist = p / pivot - 1
                  val prevVol = avg(b.v, n - 51, n - 1)
                  val volX = if (prevVol > 0) b.v[n - 1] / prevVol else 0.0
                  val status = if (dist > 0 && volX >= 1.4 && dist <= 0.05) "BREAKOUT"
                  else if (dist <= 0 && dist >= -0.03) "NEAR PIVOT"
                  else "BUILDING"
                  val entry = if (status == "BREAKOUT") p else pivot * 1.001
                  val stop = entry * 0.93

                  // RS raw score (IBD-style weighting)
                  val rsRaw = 0.4 * (p / c[n - 63] - 1) + 0.2 * (p / c[n - 126] - 1) +
                      0.2 * (p / c[n - 189] - 1) + 0.2 * (p / c[n - 252] - 1)

                  val contr = f(depths[0] * 100, 0) + "/" + f(depths[1] * 100, 0) + "/" + f(depths[2] * 100, 0)
                  return Res(sym, il, p, status, pivot, dist, volX, contr, p / hi - 1, entry, stop, avg50v, trend, vcp, rsRaw)
              }
          }
          KTEOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: breakout
        run: gradle assembleDebug --no-daemon

      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Breakout Scanner (latest)
          files: breakout/app/build/outputs/apk/debug/app-debug.apk
